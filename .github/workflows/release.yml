name: Release Windows

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      VITE_API_URL: ${{ vars.POS_API_URL }}
      MAIN_VITE_API_URL: ${{ vars.POS_API_URL }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Validate release configuration
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          $expectedTag = "v$($package.version)"

          if ($env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Tag '$env:GITHUB_REF_NAME' must match package version '$expectedTag'."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_URL)) {
            throw "Repository variable POS_API_URL is required."
          }
          if (-not (Test-Path resources/ffmpeg.exe -PathType Leaf)) {
            throw "resources/ffmpeg.exe must be committed to the repository."
          }

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build and publish release
        run: npm run release:win
        env:
          GH_TOKEN: ${{ github.token }}
