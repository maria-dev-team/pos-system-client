name: Release Windows

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  release-windows:
    name: Build and publish Windows installer
    runs-on: windows-latest
    env:
      VITE_API_URL: ${{ vars.POS_API_URL }}
      MAIN_VITE_API_URL: ${{ vars.POS_API_URL }}
      RELEASE_TAG: ${{ github.ref_name }}
      FFMPEG_WINDOWS_URL: https://github.com/BtbN/FFmpeg-Builds/releases/download/autobuild-2026-08-31-13-27/ffmpeg-n8.1.2-50-g1a748fe2cd-win64-lgpl-8.1.zip
      FFMPEG_WINDOWS_SHA256: f6274bbd9c247f9e90c1bbed066b03ed4a3907cece2fb91be6dd352393936365

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v5

      - name: Use Node.js 22
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm

      - name: Validate release configuration
        shell: pwsh
        run: |
          $tagMatch = [regex]::Match($env:RELEASE_TAG, '^v(?<version>\d+\.\d+\.\d+)$')
          if (-not $tagMatch.Success) {
            throw "Release tag '$env:RELEASE_TAG' must use the vMAJOR.MINOR.PATCH format."
          }
          if ([string]::IsNullOrWhiteSpace($env:VITE_API_URL)) {
            throw "Repository variable POS_API_URL is required."
          }
          $releaseVersion = $tagMatch.Groups['version'].Value
          "RELEASE_VERSION=$releaseVersion" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Set application version from release tag
        shell: pwsh
        run: npm version $env:RELEASE_VERSION --no-git-tag-version --allow-same-version

      - name: Install dependencies
        run: npm ci

      - name: Download and verify FFmpeg
        shell: pwsh
        run: |
          $archivePath = Join-Path $env:RUNNER_TEMP 'ffmpeg-windows.zip'
          $extractPath = Join-Path $env:RUNNER_TEMP 'ffmpeg-windows'

          Invoke-WebRequest -Uri $env:FFMPEG_WINDOWS_URL -OutFile $archivePath
          $actualHash = (Get-FileHash $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($actualHash -ne $env:FFMPEG_WINDOWS_SHA256) {
            throw "FFmpeg checksum mismatch. Expected $env:FFMPEG_WINDOWS_SHA256, received $actualHash."
          }

          Expand-Archive -Path $archivePath -DestinationPath $extractPath
          $ffmpeg = Get-ChildItem $extractPath -Filter ffmpeg.exe -File -Recurse | Select-Object -First 1
          if ($null -eq $ffmpeg) {
            throw 'The FFmpeg archive does not contain ffmpeg.exe.'
          }
          Copy-Item $ffmpeg.FullName resources/ffmpeg.exe

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Build installer
        run: npm run build:win

      - name: Create or reuse draft release
        shell: pwsh
        run: |
          $releaseJson = & gh release view $env:RELEASE_TAG --json isDraft 2>$null
          $releaseExists = $LASTEXITCODE -eq 0

          if ($releaseExists) {
            $release = $releaseJson | ConvertFrom-Json
            if (-not $release.isDraft) {
              throw "Release $env:RELEASE_TAG is already published."
            }
          } else {
            gh release create $env:RELEASE_TAG --draft --verify-tag --generate-notes --title $env:RELEASE_TAG
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to create draft release $env:RELEASE_TAG."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Upload and verify release assets
        shell: pwsh
        run: |
          $assets = @(
            (Join-Path (Get-Location) 'dist/dukenai-pos-setup.exe'),
            (Join-Path (Get-Location) 'dist/dukenai-pos-setup.exe.blockmap'),
            (Join-Path (Get-Location) 'dist/latest.yml')
          )

          foreach ($assetPath in $assets) {
            $asset = Get-Item $assetPath -ErrorAction Stop
            if ($asset.Length -le 0) {
              throw "Release asset $assetPath is empty."
            }
            gh release upload $env:RELEASE_TAG $assetPath --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Failed to upload $assetPath."
            }
          }

          $releaseJson = & gh release view $env:RELEASE_TAG --json assets,isDraft
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to inspect draft release $env:RELEASE_TAG."
          }
          $release = $releaseJson | ConvertFrom-Json
          if (-not $release.isDraft) {
            throw "Release $env:RELEASE_TAG was published before verification."
          }

          foreach ($expectedName in @('dukenai-pos-setup.exe', 'dukenai-pos-setup.exe.blockmap', 'latest.yml')) {
            $uploaded = $release.assets | Where-Object { $_.name -eq $expectedName } | Select-Object -First 1
            if ($null -eq $uploaded -or $uploaded.size -le 0) {
              throw "Release asset $expectedName is missing or empty."
            }
          }
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Publish verified release
        shell: pwsh
        run: |
          gh release edit $env:RELEASE_TAG --draft=false --latest
          if ($LASTEXITCODE -ne 0) {
            throw "Failed to publish release $env:RELEASE_TAG."
          }
        env:
          GH_TOKEN: ${{ github.token }}
